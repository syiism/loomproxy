name: gate

# 这条工作流**不是门禁的第二份事实来源**：它只调 Makefile 的既有目标（web → vet → test → go-build，
# 与 `make build` 的依赖链同序同集合）。检查清单的正本在 Makefile 的 vet 块与 AGENTS.md §3——
# 要加一道检查就在那两处加，不要在这里添新的 `run:`。
# 分四步而不是写一条 `make build`，为的是**日志的可归因性**：合成一步时红了只剩
# 「Process completed with exit code 2」，而下载完整日志要仓库管理员权限；分步之后步骤名自己说死在哪一段。
# 接上机器的动因不是"多一套检查"，是让门禁不再只对「记得跑它的那台机器」成立（同 P120/P124 的动因）。
#
# 刻意不做：
#   - 不 upload-artifact：骨架的 sources 是空携带清单（待办清单 P116/P123），
#     公开仓挂出一个可直接装的二进制，等于亲手造那台「门禁绿、服务 active、而 /datasources 是空的」的机器；
#   - 不接 viewport-check（要浏览器与一份临时实例）与 tag-sync-check（要发网络请求）——假红的门禁第二次就被无视；
#   - 不设 TZ：runner 的 UTC 正是让「按进程时区取今天」那类断言自己暴露的地方。
#   - 这四步一律不加管道：`make vet | tail` 读的是管道尾的退出码，等于门禁没跑（待办清单 P109 同一形状）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # UTC 18:00 = 北京 02:00，刻意压在「平台时区今天」与「UTC 今天」不是同一个日历日的那八小时里
    # （北京 00:00–07:59）。定时跑因此同时是那条时区断言的持续证据，而不是只看一次绿灯。
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # race 套件跨机器差好几倍（Makefile 里 test 目标那段注释记着 4 分钟与 11 分钟两种实测），
    # 显式给上限而不是让它拖到默认的 6h。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # 扫描器只读 `git ls-files`（读 index 不读历史），浅克隆够用。
          fetch-depth: 1

      - name: Make awk deterministic
        # 三支扫描器用 awk 的动态正则（check-ledger-write-checked / check-sql-reserved / check-tag-sync），
        # 写法是 POSIX 的、没有 gawk 专有特性，但开发机是 GNU Awk 5.4 而 runner 默认 mawk。
        # 这一步买的是确定性；最后那行是回执——日志里得能看见当时跑的是哪一支 awk。
        # （括号是必要的：管道读的是 head 的退出码，`awk --version | head -1 || ...` 那个 fallback 永远不会走。）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk
          sudo update-alternatives --set awk /usr/bin/gawk || echo "没有 awk 的 alternatives 组，沿用系统默认"
          (awk --version 2>/dev/null || awk -W version 2>&1) | head -1

      - name: Setup pnpm
        # pnpm 版本唯一准在 web/package.json 的 packageManager（10.33.0），action 读 package_json_file 取它，
        # 与 Dockerfile 的 corepack 同源；P128 已收口。10.33.0 认 web/pnpm-workspace.yaml 的 allowBuilds.esbuild。
        # 必须在 setup-node 之前：那一步的 cache: pnpm 要调 pnpm 取 store 路径。
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          # 跟着模块声明走而不是抄开发机那颗更新的 go：gofmt/vet 的判定随版本走，
          # Makefile 里的 GOFMT_EXEMPT_RE 就是这一族留下来的存量包袱。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install frontend deps (locked)
        working-directory: web
        # 比本地多出来的那半句：`make web` 里那条裸 `pnpm install` 允许静默改锁。
        # 先钉一次，锁与 package.json 漂了就当场红，而不是换一棵依赖树继续往下跑。
        run: pnpm install --frozen-lockfile

      - name: make web
        # 前端产物是 go:embed 的输入，必须先于 Go 侧（Makefile 的 build 依赖链就是这个顺序）。
        # tee 不是加检查，是让失败的那一步能把末尾留给自己看（见文件末那条 handler）。
        # pipefail 是必须的写法：没有它，管道读的是 tee 的 0 而不是 make 的退出码（P109 那个形状）。
        run: |
          set -o pipefail
          make web 2>&1 | tee /tmp/stage-web.log

      - name: make vet
        # 静态段：go vet + gofmt + 那二十来支扫描器。**清单在 Makefile 的 vet 块里，不要在这里加。**
        run: |
          set -o pipefail
          make vet 2>&1 | tee /tmp/stage-vet.log

      - name: make test
        # go test ./... -race -count=1 -timeout 20m（跑全部包，不只 ./test/）。
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/stage-test.log

      - name: make go-build
        # 调试版与 strip 版两个产物（CI 不上传，理由见文件头）。
        run: |
          set -o pipefail
          make go-build 2>&1 | tee /tmp/stage-build.log

      - name: Surface the failing stage
        # 红了把失败那一步的日志发成 annotation——`GET /actions/runs/{id}/logs` 要仓库管理员权限（未认证 403），
        # 而 annotations 免鉴权就能读。**判定不由这一步参与**：它只回声，不加检查、不改退出码。
        # 第一版只发 `tail -25`，结果 `make test` 红时恰好被切掉：Go 把 `--- FAIL: TestXxx` 打在包汇总**之前**，
        # 尾巴只剩后面的 ok/skip 那几行——**回显的判据要按失败行的真实位置来定，不是按"末尾多少行"**。
        # 所以现在两段：先把 FAIL/panic/race 那几行连行号捞出来，再附末尾 40 行作上下文。
        # `%0A` 是 workflow command 的换行转义（裸换行会把消息截断）；head -c 是防消息体超 annotation 上限。
        if: failure()
        run: |
          f=$(ls -t /tmp/stage-*.log 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            hits=$(grep -nE '^ *--- FAIL|^panic:|^WARNING: DATA RACE|^FAIL[ \t]|Error:|未通过|Syntax error' "$f" | head -18)
            [ -n "$hits" ] || hits='(没捞到失败行——只有末尾上下文，见下)'
            msg=$(printf '%s\n---- 末尾 40 行 ----\n%s\n' "$hits" "$(tail -n 40 "$f")" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | head -c 3600)
            echo "::error::失败阶段 ${f#/tmp/stage-}：${msg}"
          else
            echo "::error::失败在 make 之前（工具链或缓存那几步），没有 stage 日志"
          fi
